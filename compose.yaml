# docker compose up    app + a local mock of SaaS Custom Domains
services:
  app:
    build: .
    ports: ["${APP_PORT:-3000}:3000"]
    environment:
      # "app" is how the mock (proxy and webhooks) reaches this container.
      APP_HOSTS: localhost,app
      APP_DOMAIN: statuspage.com
      SCD_API_URL: http://scd-mock:4010
      SCD_API_TOKEN: scd_test_token
      SCD_ACCOUNT_UUID: acc_local
      SCD_UPSTREAM_UUID: upstream_local
      PROXY_AUTH_TOKEN: local_proxy_token
      SCD_WEBHOOK_TOKEN: local_webhook_token
      # Run background jobs (Solid Queue) inside Puma.
      SOLID_QUEUE_IN_PUMA: "true"
      # Plain HTTP locally. In production, leave it unset.
      FORCE_SSL: "false"
      # Local only. In production, set your own (bin/rails secret).
      SECRET_KEY_BASE: local-only-not-a-secret-0123456789abcdef0123456789abcdef
    volumes: [storage:/rails/storage]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 2s
      retries: 30

  # Stands in for SaaS Custom Domains: the API on :4010 and the proxy
  # on port 80, so http://anything.localhost reaches your app the way
  # a customer's domain would.
  scd-mock:
    image: ghcr.io/saas-custom-domains/scd-mock:latest
    ports:
      - "${SCD_MOCK_API_PORT:-4010}:4010"
      - "${SCD_MOCK_PROXY_PORT:-80}:4080"
    environment:
      SCD_MOCK_UPSTREAM_HOST: app
      SCD_MOCK_UPSTREAM_PORT: 3000
      SCD_MOCK_UPSTREAM_AUTH_TOKEN: local_proxy_token
      SCD_MOCK_WEBHOOK_URL: http://app:3000/webhooks/saas_domains
      SCD_MOCK_WEBHOOK_TOKEN: local_webhook_token
      # Test domains under .test count as pointed at the proxy.
      SCD_MOCK_VALID_HOSTS: "*.test"
      # Production sends https. The mock has no TLS and your browser is
      # on http://, so say http, or Rails' CSRF origin check fails.
      SCD_MOCK_FORWARDED_PROTO: http

volumes:
  storage:
